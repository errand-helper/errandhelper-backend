services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # environment:
    #   - POSTGRES_DB=${POSTGRES_DB:-docker_django}
    #   - POSTGRES_USER=${POSTGRES_USER:-db_user}
    #   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-db_password}
    env_file:
      - .env.prod

  errandhelper:
    build: .
    container_name: errandhelper-backend
    depends_on:
      - db
    volumes:
      - ./static:/app/staticfiles
    # environment:
    #   - DATABASE_USER=${POSTGRES_USER:-db_user}
    #   - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-db_password}
    #   - DATABASE_NAME=${POSTGRES_DB:-docker_django}
    #   - DATABASE_HOST=db
    #   - DATABASE_PORT=5432
    env_file:
      - .env.prod

  admin-proxy:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
    depends_on:
      - errandhelper
volumes:
  postgres_data:
  # Note for developers:
  # - The database credentials are defined in .env.prod
  # - Database username: db_user 
  # - Database name: docker_django
