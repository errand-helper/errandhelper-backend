services:
  db:
    image: postgres:17
    restart: always
    expose:
      - 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
  
  redis_db:
    image: redis
    restart: always
    expose:
      - 6388
    ports:
      - "6388:6388"
    volumes:
        - redis_data:/data
    entrypoint: redis-server --appendonly yes --port 6388

  errandhelper:
    build: .
    container_name: errandhelper-backend
    depends_on:
      - db
    volumes:
      - staticfiles:/app/staticfiles
    env_file:
      - .env

  admin-proxy:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/static:ro
    depends_on:
      - errandhelper
volumes:
  postgres_data:
  redis_data:
  staticfiles:
  # Note for developers:
  # - The database credentials are defined in .env.prod
  # - Database username: db_user 
  # - Database name: docker_django
