name: Build and Publish image to Docker Hub

on:
  push:
    branches: [ "master" ]
    # paths: ['/']
  pull_request:
    branches: [ "master" ]


jobs:
  publish_images:
  # build:

    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build ./ -t motieno205/errandhelper-backend:latest
    - name: push image to docker hub
      run: |
        docker login -u motieno205 -p ${{ secrets.DOCKER_HUB_TOKEN }}
        docker push motieno205/errandhelper-backend:latest:latest
