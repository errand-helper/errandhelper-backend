name: Build and Publish image to Docker Hub

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test_django:
    uses: ./.github/workflows/test-django.yaml
  publish_images:
    runs-on: ubuntu-latest
    needs: [test_django]
    env:
      DJANGO_SECRET_KEY: test-key-not-good-maybe-make-one-better
      USE_S3: "false"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker container
      run: |
        docker build \
          -t "${{ secrets.IMAGE_NAME }}:$(echo ${{ github.sha }} | cut -c1-7)" \
          -t "${{ secrets.IMAGE_NAME }}:latest" \
          .
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
    - name: Push Docker images
      run: |
        docker push "${{ secrets.IMAGE_NAME }}:$(echo ${{ github.sha }} | cut -c1-7)"
        docker push "${{ secrets.IMAGE_NAME }}:latest"
